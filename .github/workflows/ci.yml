name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover tests -v

  bash-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Bash scripts (shellcheck is preinstalled on GitHub runners)
        run: shellcheck scripts/*.sh
      - name: Help text works
        run: ./scripts/net-check.sh --help
      # This exercises the Linux code paths (ip route, ping -W). GitHub-hosted
      # runners block outgoing ping, so the router check is expected to warn.
      # The step reports the output but does not fail the build.
      - name: Smoke run of net-check.sh on Linux
        run: ./scripts/net-check.sh || echo "net-check exited $? (expected on runners without ICMP)"
